server:
  port: 8080

spring:
  application:
    name: netflix-resilience-microservice

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

# Resilience4j Core Configuration: CircuitBreaker, RateLimiter, Bulkhead & Retry
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50.0
        slowCallDurationThreshold: 1500ms
        slowCallRateThreshold: 50.0
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.lang.Throwable
        ignoreExceptions: []
        eventConsumerBufferSize: 100
    instances:
      streamingServiceCircuitBreaker:
        baseConfig: default

  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms
        eventConsumerBufferSize: 100
    instances:
      clientRateLimiter:
        baseConfig: default

  bulkhead:
    configs:
      default:
        registerHealthIndicator: true
        maxConcurrentCalls: 10
        maxWaitDuration: 10ms
        eventConsumerBufferSize: 100
    instances:
      streamingBulkhead:
        baseConfig: default

  retry:
    configs:
      default:
        registerHealthIndicator: true
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptions:
          - com.netflix.resilience.exception.DownstreamServiceException
        eventConsumerBufferSize: 100
    instances:
      streamingRetry:
        baseConfig: default
