server:
  port: 8080

spring:
  application:
    name: netflix-resilience-microservice

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

# Resilience4j Core Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50.0
        slowCallDurationThreshold: 1500ms
        slowCallRateThreshold: 50.0
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.lang.Throwable
        ignoreExceptions: []
        eventConsumerBufferSize: 100
    instances:
      streamingServiceCircuitBreaker:
        baseConfig: default
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms
        eventConsumerBufferSize: 100
    instances:
      clientRateLimiter:
        baseConfig: default
