version: '3.8'

services:
  netflix-resilience-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netflix-resilience-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms512m -Xmx1024m
    restart: unless-stopped
    networks:
      - netflix-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: netflix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge

